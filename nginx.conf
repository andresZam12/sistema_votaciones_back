events {
    worker_connections 65535;
    multi_accept on;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # RT-2: Balanceo Round-Robin estricto sin sesiones pegajosas (PROHIBIDO ip_hash)
    upstream backend_cluster {
        server app:3000;
    }

    server {
        listen 80;
        server_name _;

        # Logs optimizados
        access_log off;
        error_log /var/log/nginx/error.log warn;

        location / {
            proxy_pass http://backend_cluster;

            # Protocolo HTTP/1.1 obligatorio para SSE y WebSockets
            proxy_http_version 1.1;

            # Deshabilitar buffering para entrega inmediata de streaming SSE (RF-4)
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Soporte de WebSockets para Auditores (RF-7)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Cabeceras de trazabilidad
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts prolongados para conexiones de larga duración (1 hora)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
