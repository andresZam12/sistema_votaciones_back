sonar.projectKey=andresZam12_sistema_votaciones_back
sonar.organization=andreszam12

# Fuentes a analizar
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=test/**/*.test.ts

# Exclusiones de archivos que no son código de producción de la app
sonar.exclusions=scripts/**,loadtest/**,dist/**,db/**,test/**,node_modules/**,*.config.ts

# Evitar fallo de Quality Gate por falta de reporte de cobertura en análisis automático
sonar.coverage.exclusions=**/*
sonar.cpd.exclusions=**/*
