services:
  redis:
    image: redis:7-alpine
    container_name: votaciones-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: votaciones-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: votaciones
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  app:
    build: .
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/votaciones
      FANOUT_WINDOW_MS: 2000
      FANOUT_BATCH: 500
      MAX_BUFFERED_BYTES: 262144
      JURADO_KEYS: jurado-key-demo,JUR-88134
      AUDITOR_KEYS: auditor-key-demo,AUD-01
    depends_on:
      - redis
      - postgres
    restart: always
    deploy:
      replicas: 8

  # Servicio de utilidad para cargar la topologia electoral (RF-3).
  # No se levanta con "docker compose up": usa la etapa "builder" (tiene tsx y
  # las devDependencies) porque la imagen de produccion de "app" no incluye
  # scripts/ ni tsx. Ejecutar con: docker compose run --rm seed
  seed:
    build:
      context: .
      target: builder
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/votaciones
    command: ["npx", "tsx", "scripts/seed.ts"]
    depends_on:
      - redis
      - postgres
    profiles:
      - tools

  nginx:
    image: nginx:alpine
    container_name: votaciones-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always

volumes:
  redis_data:
  pg_data:
