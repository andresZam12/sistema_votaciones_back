services:
  redis:
    image: redis:7-alpine
    container_name: votaciones-redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: votaciones-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: votaciones
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: always

  app:
    build: .
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/votaciones
      FANOUT_WINDOW_MS: 2000
      FANOUT_BATCH: 500
      MAX_BUFFERED_BYTES: 262144
      JURADO_KEYS: jurado-key-demo,JUR-88134
      AUDITOR_KEYS: auditor-key-demo,AUD-01
    depends_on:
      - redis
      - postgres
    restart: always

volumes:
  redis_data:
  pg_data:
